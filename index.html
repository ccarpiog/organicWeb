<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Química orgánica</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <h1>Química orgánica</h1>
      <p class="app-subtitle">Dibuja un hidrocarburo y descubre su nombre</p>
    </div>
    <div class="app-header-actions" id="header-actions">
      <!-- The Ejemplos menu is created by src/ui/examples.js. -->
    </div>
  </header>

  <main class="app-main">
    <nav class="toolbar" id="toolbar" aria-label="Herramientas de dibujo">
      <!-- Tool buttons are created by src/ui/toolbar.js. -->
    </nav>

    <section class="canvas-area" aria-label="Zona de dibujo">
      <svg id="canvas" class="canvas" role="img" aria-label="Lienzo de dibujo de la molécula"
           xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <div id="canvas-bar" class="canvas-bar">
        <!-- Formula, display toggle and Centrar are created by src/ui/canvasbar.js. -->
      </div>
    </section>

    <aside class="results" id="results" aria-label="Resultado">
      <button type="button" id="name-button" class="name-button" disabled>¿Cómo se llama?</button>
      <div class="results-body" aria-live="polite">
        <p class="results-hint">Dibuja una molécula en el lienzo y pulsa «¿Cómo se llama?».</p>
      </div>
    </aside>
  </main>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog">
      <h2 id="confirm-dialog-title" data-role="title"></h2>
      <p data-role="message"></p>
      <div class="dialog-buttons">
        <button type="submit" value="cancel" data-role="cancel" class="dialog-button"></button>
        <button type="submit" value="confirm" data-role="confirm" class="dialog-button dialog-button--danger"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
